name: Scrape TGB Schedule

on:
  schedule:
    - cron: '0 19 * * *'  # Taiwan time 03:00
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run scraper
        id: scrape
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
        run: node packages/scraper/full-scrape.js
