name: Scrape Pending Results

on:
  schedule:
    - cron: '0 * * * *'  # Every hour
  workflow_dispatch:

jobs:
  results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Query pending divisions from D1
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 execute tgb-cal --remote \
            --command "SELECT DISTINCT d.level_id, d.gid, d.name as division_name, l.name as league_name FROM games g JOIN divisions d ON g.level_id = d.level_id JOIN leagues l ON d.gid = l.gid WHERE g.status != 'completed' AND g.scheduled_at < unixepoch()" \
            --json > /tmp/raw.json
          node -e "
            const r = JSON.parse(require('fs').readFileSync('/tmp/raw.json', 'utf8'));
            const rows = r[0]?.results ?? [];
            require('fs').writeFileSync('/tmp/pending_divisions.json', JSON.stringify(rows));
            console.log('Pending divisions:', rows.length);
          "

      - name: Scrape pending results
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: node packages/scraper/results-scrape.js /tmp/pending_divisions.json
