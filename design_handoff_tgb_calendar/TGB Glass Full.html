  { tid: 'dolphins',  name: '新北海豚', enName: 'New Taipei Dolphins',league: '北區羽球聯誼賽',   enLeague: 'North Badminton',      members: 8,  color: '#16a085' },
  { tid: 'mountains', name: '南投山林', enName: 'Nantou Mountains', league: '中部足球甲級',       enLeague: 'Central Soccer',       members: 18, color: '#27ae60' },

const TEAM = {
  tid: 'flyhawks', name: '台北飛鷹', enName: 'Taipei Flyhawks',

    { league: '北區企業盃 8 人籃球', enLeague: 'North Corporate 8s',  group: '預賽 B 組', enGroup: 'Prelim B', record: '3–0', scheduled: 3, total: 6, next: { date: '5/18', day: '週一', enDay: 'Mon', time: '20:00', opponent: '桃園都會', enOpp: 'Taoyuan Metro', venue: '林口體育館', enVenue: 'Linkou Arena' } },
  ],
  pastSeason: { league: '2025 冬季 TSBL', enLeague: '2025 Winter TSBL', group: 'A 組', enGroup: 'Group A', record: '11–4', place: '季軍', enPlace: '3rd place' },

// ===== styles =====
const C = {
  font: '"Inter","Noto Sans TC", -apple-system, system-ui, sans-serif',
  mono: '"JetBrains Mono", ui-monospace, monospace',
  bg: '#eef1f7',
  ink: '#0d1426',
  muted: '#5b6478',
  faint: '#9ba3b4',
  line: 'rgba(13,20,38,0.08)',
  glassBg: 'rgba(255,255,255,0.65)',
  glassBorder: 'rgba(255,255,255,0.9)',
  blue: '#3b6dff',
  violet: '#7a4dff',
};
const glass = {
  background: C.glassBg, border: `1px solid ${C.glassBorder}`,
  borderRadius: 16, backdropFilter: 'blur(20px)', WebkitBackdropFilter: 'blur(20px)',
  boxShadow: '0 1px 0 rgba(255,255,255,0.8) inset, 0 8px 24px rgba(13,20,38,0.06)',
};
const grad = `linear-gradient(135deg, ${C.blue}, ${C.violet})`;

function Frame({ children, w=400, h=720 }) {
  return (
    <div style={{ width: w, height: h, color: C.ink, fontFamily: C.font, position: 'relative', overflow: 'hidden', background: C.bg, borderRadius: 28, boxShadow: '0 30px 80px rgba(13,20,38,.18), 0 6px 18px rgba(13,20,38,.08)' }}>
      {/* halos */}
      <div style={{ position: 'absolute', inset: 0, pointerEvents: 'none' }}>
        <div style={{ position: 'absolute', top: -80, right: -60, width: 260, height: 260, borderRadius: 999, background: 'radial-gradient(circle, rgba(122,77,255,.38), transparent 70%)' }}/>
        <div style={{ position: 'absolute', top: 220, left: -80, width: 260, height: 260, borderRadius: 999, background: 'radial-gradient(circle, rgba(59,109,255,.32), transparent 70%)' }}/>
        <div style={{ position: 'absolute', bottom: -110, right: -60, width: 260, height: 260, borderRadius: 999, background: 'radial-gradient(circle, rgba(59,109,255,.22), transparent 70%)' }}/>
      </div>
      <div style={{ position: 'relative', display: 'flex', flexDirection: 'column', height: '100%' }}>{children}</div>
    </div>
  );
}

// language-aware bits
function teamName(t, lang) { return lang === 'en' ? t.enName : t.name; }
function teamLeague(t, lang) { return lang === 'en' ? t.enLeague : t.league; }

// ===== components =====
function TopBar({ lang, setLang, onPrivacy, onTerms, leftSlot }) {
  return (
    <div style={{ padding: '14px 20px 0', display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontFamily: C.mono, fontSize: 11, color: C.muted }}>
      <div>{leftSlot}</div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
        <button onClick={() => setLang(lang === 'zh' ? 'en' : 'zh')} style={{
          ...glass, borderRadius: 999, padding: '4px 10px', fontFamily: C.mono, fontSize: 10, color: C.ink,
          cursor: 'pointer', display: 'inline-flex', alignItems: 'center', gap: 6, fontWeight: 600,
        }}>
          <span style={{ color: lang==='zh' ? C.blue : C.faint }}>中</span>
          <span style={{ color: C.faint }}>·</span>
          <span style={{ color: lang==='en' ? C.blue : C.faint }}>EN</span>
        </button>
      </div>
    </div>
  );
}

function Footer({ lang, onPrivacy, onTerms }) {
  const t = T[lang];
  return (
    <div style={{ padding: '10px 20px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontFamily: C.mono, fontSize: 10, color: C.faint }}>
      <span>v1.0 · tgb.ming060.com</span>
      <div style={{ display: 'flex', gap: 12 }}>
        <button onClick={onPrivacy} style={linkBtn}>{t.privacy}</button>
        <button onClick={onTerms} style={linkBtn}>{t.terms}</button>
      </div>
    </div>
  );
}
const linkBtn = { background: 'transparent', border: 0, color: C.muted, fontFamily: C.mono, fontSize: 10, cursor: 'pointer', padding: 0, textDecoration: 'underline', textUnderlineOffset: 2 };

function Modal({ title, updated, body, onClose, lang }) {
  const t = T[lang];
  return (
    <div style={{ position: 'absolute', inset: 0, zIndex: 20, display: 'flex', alignItems: 'flex-end', justifyContent: 'center' }}>
      <div onClick={onClose} style={{ position: 'absolute', inset: 0, background: 'rgba(13,20,38,.35)', backdropFilter: 'blur(4px)' }}/>
      <div style={{ ...glass, position: 'relative', width: '100%', maxHeight: '88%', borderRadius: '20px 20px 0 0', display: 'flex', flexDirection: 'column', background: 'rgba(255,255,255,.92)' }}>
        <div style={{ padding: '16px 20px 8px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderBottom: `1px solid ${C.line}` }}>
          <div>
            <div style={{ fontSize: 16, fontWeight: 700, letterSpacing: -0.3 }}>{title}</div>
            <div style={{ fontFamily: C.mono, fontSize: 10, color: C.muted, marginTop: 2 }}>{updated}</div>
          </div>
          <button onClick={onClose} style={{ ...glass, borderRadius: 999, width: 32, height: 32, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', color: C.ink, fontSize: 14, padding: 0 }}>×</button>
        </div>
        <div style={{ padding: '14px 20px 20px', overflowY: 'auto', fontSize: 13, lineHeight: 1.7, color: C.ink }}>
          {body.map(([h, p], i) => (
            <div key={i} style={{ marginBottom: 14 }}>
              <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 4, color: C.ink, display: 'flex', alignItems: 'center', gap: 6 }}>
                <span style={{ width: 4, height: 4, borderRadius: 99, background: C.blue }}/>
                {h}
              </div>
              <div style={{ color: C.muted }}>{p}</div>
            </div>
          ))}
          <button onClick={onClose} style={{ width: '100%', marginTop: 6, padding: '11px 12px', borderRadius: 12, border: 0, background: grad, color: '#fff', fontWeight: 600, fontSize: 13, cursor: 'pointer', boxShadow: `0 6px 18px rgba(59,109,255,.32)` }}>{t.close}</button>
        </div>
      </div>
    </div>
  );
}

// ===== Home =====
function Home({ lang, setLang, onOpenTeam, onPrivacy, onTerms }) {
  const t = T[lang];
  const [q, setQ] = React.useState('');
  const results = React.useMemo(() => {
    const s = q.trim().toLowerCase();
    if (!s) return [];
    return TEAMS_ZH.filter(x =>
      x.name.toLowerCase().includes(s) || x.enName.toLowerCase().includes(s) ||
      x.league.toLowerCase().includes(s) || x.enLeague.toLowerCase().includes(s) ||
      x.tid.includes(s)
    ).slice(0,6);
  }, [q]);

  return (
    <Frame>
      <TopBar lang={lang} setLang={setLang} leftSlot={<span>9:41</span>}/>
      <div style={{ padding: '24px 20px 0' }}>
        <div style={{ display: 'inline-flex', alignItems: 'center', gap: 6, padding: '4px 10px', ...glass, borderRadius: 999, fontSize: 11, color: C.muted, fontFamily: C.mono, fontWeight: 600 }}>
          <span style={{ width: 5, height: 5, borderRadius: 99, background: C.blue }}/>
          {t.brand}
        </div>
        <h1 style={{ margin: '14px 0 0', fontSize: 32, fontWeight: 700, lineHeight: 1.1, letterSpacing: -1 }}>
          {t.tagline_a}<br/>
          <span style={{ background: grad, WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent', backgroundClip: 'text' }}>{t.tagline_b}</span>
        </h1>
        <p style={{ marginTop: 10, fontSize: 13, color: C.muted, lineHeight: 1.6 }}>{t.sub_hero}</p>
      </div>

      <div style={{ padding: '18px 20px 0' }}>
        <div style={{
          ...glass, borderRadius: 14, display: 'flex', alignItems: 'center', padding: '0 14px',
          boxShadow: q ? `0 1px 0 rgba(255,255,255,.8) inset, 0 8px 24px rgba(13,20,38,.08), 0 0 0 3px rgba(59,109,255,.18)` : glass.boxShadow,
          transition: 'box-shadow .18s',
        }}>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={q ? C.blue : C.muted} strokeWidth="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input value={q} onChange={e => setQ(e.target.value)} placeholder={t.search_ph}
            style={{ flex: 1, border: 0, outline: 0, background: 'transparent', padding: '12px 12px', fontSize: 14, fontFamily: C.font, color: C.ink }}/>
          <span style={{ fontFamily: C.mono, fontSize: 10, color: C.faint, padding: '2px 6px', background: 'rgba(13,20,38,.05)', borderRadius: 4 }}>⌘K</span>
        </div>
        {q && (
          <div style={{ marginTop: 8, ...glass, overflow: 'hidden' }}>
            {results.length === 0 && <div style={{ padding: 14, fontSize: 13, color: C.muted }}>{t.no_match(q)}</div>}
            {results.map((x, i) => (
              <div key={x.tid} onClick={() => onOpenTeam(x.tid)}
                style={{ padding: '11px 14px', borderTop: i ? `1px solid ${C.line}` : 0, display: 'flex', alignItems: 'center', gap: 12, cursor: 'pointer' }}>
                <span style={{ width: 32, height: 32, borderRadius: 10, background: `linear-gradient(135deg, ${x.color}, ${x.color}dd)`, color: '#fff', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', fontWeight: 700, fontSize: 13, boxShadow: `0 4px 10px ${x.color}33` }}>{(lang==='en'?x.enName:x.name)[0]}</span>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontWeight: 600, fontSize: 13 }}>{teamName(x, lang)}</div>
                  <div style={{ fontSize: 10, color: C.muted, marginTop: 2, fontFamily: C.mono }}>{teamLeague(x, lang)}</div>
                </div>
                <span style={{ color: C.blue, fontSize: 14 }}>→</span>
              </div>
            ))}
          </div>
        )}
      </div>

      {!q && (
        <div style={{ padding: '22px 20px 0', flex: 1, overflow: 'hidden' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 10 }}>
            <span style={{ fontFamily: C.mono, fontSize: 10, color: C.muted, letterSpacing: 1.5 }}>{t.popular.toUpperCase()}</span>
            <span style={{ fontFamily: C.mono, fontSize: 10, color: C.faint }}>{TEAMS_ZH.length.toString().padStart(2,'0')}</span>
          </div>
          <div style={{ ...glass, overflow: 'hidden' }}>
            {TEAMS_ZH.slice(0,5).map((x, i) => (
              <div key={x.tid} onClick={() => onOpenTeam(x.tid)}
                style={{ padding: '11px 14px', borderTop: i ? `1px solid ${C.line}` : 0, display: 'flex', alignItems: 'center', gap: 12, cursor: 'pointer' }}>
                <span style={{ fontFamily: C.mono, fontSize: 11, color: C.faint, width: 18 }}>{(i+1).toString().padStart(2,'0')}</span>
                <span style={{ width: 28, height: 28, borderRadius: 9, background: `linear-gradient(135deg, ${x.color}, ${x.color}dd)`, color: '#fff', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', fontWeight: 700, fontSize: 12, boxShadow: `0 3px 8px ${x.color}33` }}>{(lang==='en'?x.enName:x.name)[0]}</span>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 13, fontWeight: 600 }}>{teamName(x, lang)}</div>
                  <div style={{ fontSize: 10, color: C.muted, marginTop: 1, fontFamily: C.mono, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{teamLeague(x, lang)}</div>
                </div>
                <span style={{ fontFamily: C.mono, fontSize: 10, color: C.faint }}>{t.members(x.members)}</span>
              </div>
            ))}
          </div>
        </div>
      )}
      <Footer lang={lang} onPrivacy={onPrivacy} onTerms={onTerms}/>
    </Frame>
  );
}

// ===== Team =====
function Team({ lang, setLang, onBack, onPrivacy, onTerms }) {
  const t = T[lang];
  const team = TEAM;
  const [copied, setCopied] = React.useState(false);
  const copyLink = () => {
    try { navigator.clipboard?.writeText(team.icalUrl); } catch (e) {}
    setCopied(true); setTimeout(() => setCopied(false), 1800);
  };

  return (
    <Frame>
      <TopBar lang={lang} setLang={setLang} leftSlot={
        <button onClick={onBack} style={{ background: 'transparent', border: 0, color: C.muted, fontFamily: C.mono, fontSize: 11, cursor: 'pointer', padding: 0 }}>← {t.back}</button>
      }/>
      <div style={{ padding: '18px 20px 0' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 6, fontFamily: C.mono, fontSize: 10, color: C.muted, letterSpacing: 1 }}>
          <span style={{ width: 6, height: 6, borderRadius: 99, background: C.blue, boxShadow: `0 0 6px ${C.blue}` }}/>
          {t.active.toUpperCase()} · {team.tid.toUpperCase()}
        </div>
        <h1 style={{ margin: '6px 0 0', fontSize: 28, fontWeight: 700, letterSpacing: -0.6 }}>{lang==='en'?team.enName:team.name}</h1>
        <div style={{ marginTop: 4, fontSize: 12, color: C.muted }}>{lang==='en'?team.enSeason:team.season} · {t.season_count(team.seasons.length)}</div>

        <div style={{ marginTop: 14, ...glass, borderRadius: 14, display: 'grid', gridTemplateColumns: '1fr 1fr 1fr' }}>
          {[
            { l: t.win, v: team.record.wins, c: C.blue },
            { l: t.loss, v: team.record.losses, c: C.ink },
            { l: t.sched, v: `${team.scheduled}/${team.total}`, c: C.violet },
          ].map((s, i) => (
            <div key={i} style={{ padding: '12px 14px', borderLeft: i ? `1px solid ${C.line}` : 0 }}>
              <div style={{ fontFamily: C.mono, fontSize: 9, color: C.muted, letterSpacing: 1.5, textTransform: 'uppercase' }}>{s.l}</div>
              <div style={{ fontFamily: C.mono, fontSize: 22, fontWeight: 700, color: s.c, marginTop: 4, lineHeight: 1 }}>{s.v}</div>
            </div>
          ))}
        </div>
      </div>

      <div style={{ padding: '16px 20px 0', flex: 1, overflowY: 'auto' }}>
        <div style={{ fontFamily: C.mono, fontSize: 10, color: C.muted, letterSpacing: 1.5, marginBottom: 8, textTransform: 'uppercase' }}>{t.active_seasons} · {team.seasons.length.toString().padStart(2,'0')}</div>
        {team.seasons.map((s, i) => (
          <div key={i} style={{ ...glass, padding: 14, marginBottom: 10, position: 'relative', overflow: 'hidden' }}>
            <div style={{ position: 'absolute', top: 0, left: 0, bottom: 0, width: 3, background: grad }}/>
            <div style={{ display: 'flex', justifyContent: 'space-between', gap: 8, alignItems: 'flex-start' }}>
              <div style={{ minWidth: 0 }}>
                <div style={{ fontSize: 13, fontWeight: 600, lineHeight: 1.3 }}>{lang==='en'?s.enLeague:s.league}</div>
                <div style={{ fontSize: 11, color: C.muted, marginTop: 2 }}>{lang==='en'?s.enGroup:s.group} · {t.scheduled_of(s.scheduled, s.total)}</div>
              </div>
              <span style={{ background: grad, color: '#fff', padding: '3px 9px', borderRadius: 6, fontFamily: C.mono, fontSize: 11, fontWeight: 600, whiteSpace: 'nowrap', boxShadow: `0 4px 10px rgba(59,109,255,.3)` }}>{s.record}</span>
            </div>
            <div style={{ marginTop: 10, padding: 10, background: 'rgba(59,109,255,.06)', borderRadius: 10, display: 'flex', alignItems: 'center', gap: 10 }}>
              <div style={{ fontFamily: C.mono, color: C.blue, fontWeight: 700 }}>
                <div style={{ fontSize: 13, lineHeight: 1 }}>{s.next.date}</div>
                <div style={{ fontSize: 10, color: C.muted, marginTop: 2, fontWeight: 500 }}>{s.next.time}</div>
              </div>
              <div style={{ flex: 1, minWidth: 0, fontSize: 12 }}>
                <div style={{ fontFamily: C.mono, fontSize: 9, color: C.muted, letterSpacing: 1, textTransform: 'uppercase' }}>{t.next_match}</div>
                <div style={{ fontWeight: 600 }}>vs {lang==='en'?s.next.enOpp:s.next.opponent}</div>
                <div style={{ color: C.muted, fontSize: 11, marginTop: 1 }}>{lang==='en'?s.next.enVenue:s.next.venue}</div>
              </div>
            </div>
          </div>
        ))}
      </div>

      <div style={{ padding: 16, ...glass, borderRadius: 0, borderLeft: 0, borderRight: 0, borderBottom: 0 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 8 }}>
          <span style={{ fontFamily: C.mono, fontSize: 10, color: C.muted, letterSpacing: 1.5, textTransform: 'uppercase' }}>{t.subscribe}</span>
          <span style={{ fontSize: 10, color: C.faint }}>{t.sub_help}</span>
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>
          <a href={team.webcalUrl} style={{ ...btn, background: grad, color: '#fff', boxShadow: `0 6px 18px rgba(59,109,255,.35)` }}> {t.apple}</a>
          <a href={team.googleUrl} style={{ ...btn, background: 'rgba(255,255,255,.85)', color: C.ink, border: `1px solid ${C.line}` }}> {t.google}</a>
        </div>
        <button onClick={copyLink} style={{
          marginTop: 8, width: '100%', background: 'transparent', color: C.muted,
          padding: '9px 12px', border: `1px solid ${C.line}`, borderRadius: 10,
          fontSize: 11, fontFamily: C.mono, cursor: 'pointer',
          display: 'flex', justifyContent: 'space-between', alignItems: 'center',
        }}>
          <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{team.icalUrl.replace('https://','')}</span>
          <span style={{ color: copied ? C.blue : C.muted, fontWeight: 600, marginLeft: 8 }}>{copied ? '✓ '+t.copied : t.copy.toUpperCase()}</span>
        </button>
      </div>
      <Footer lang={lang} onPrivacy={onPrivacy} onTerms={onTerms}/>
    </Frame>
  );
}

const btn = { display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '12px 12px', borderRadius: 12, fontWeight: 600, fontSize: 13, textDecoration: 'none', textAlign: 'center', fontFamily: C.font };

// ===== App with two screens shown side-by-side =====
function App() {
  const [lang, setLang] = React.useState('zh');
  const [modal, setModal] = React.useState(null); // 'privacy' | 'terms' | null
  const [view, setView] = React.useState('home'); // 'home' | 'team'
  const t = T[lang];

  const openTeam = () => setView('team');
  const back = () => setView('home');

  return (
    <div style={{ display: 'flex', gap: 32, padding: 32, alignItems: 'flex-start' }}>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
        <span style={{ fontFamily: C.mono, fontSize: 11, color: C.muted, letterSpacing: 1.5 }}>HOME · {lang === 'en' ? 'Home' : '首頁'}</span>
        <div style={{ position: 'relative' }}>
          <Home lang={lang} setLang={setLang}
            onOpenTeam={openTeam}
            onPrivacy={() => setModal('privacy')}
            onTerms={() => setModal('terms')}/>
          {modal && view === 'home' && (
            <Modal lang={lang}
              title={modal==='privacy' ? t.privacy_title : t.terms_title}
              updated={modal==='privacy' ? t.privacy_updated : t.terms_updated}
              body={modal==='privacy' ? t.privacy_body : t.terms_body}
              onClose={() => setModal(null)}/>
          )}
        </div>
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
        <span style={{ fontFamily: C.mono, fontSize: 11, color: C.muted, letterSpacing: 1.5 }}>TEAM · {lang === 'en' ? 'Team page' : '球隊頁'}</span>
        <div style={{ position: 'relative' }}>
          <Team lang={lang} setLang={setLang}
            onBack={back}
            onPrivacy={() => setModal('privacy')}
            onTerms={() => setModal('terms')}/>
          {modal && view === 'team' && (
            <Modal lang={lang}
              title={modal==='privacy' ? t.privacy_title : t.terms_title}
              updated={modal==='privacy' ? t.privacy_updated : t.terms_updated}
              body={modal==='privacy' ? t.privacy_body : t.terms_body}
              onClose={() => setModal(null)}/>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
